services:
  - type: web
    name: agro-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: "https://agro-frontend.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://agro-frontend.onrender.com"
      - key: MODEL_PATH
        value: "/models"
    healthCheckPath: /api/health/

  - type: web
    name: agro-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: "https://agro-backend.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html